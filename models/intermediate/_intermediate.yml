version: 2

models:
  - name: int_contracts__scoped
    columns:
      - name: cnt_id_nk
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnt_id_nk, cnt_iss_cd_nk, plan_cd]

  - name: int_owners__by_contract
    description: One primary owner per contract account.
    columns:
      - name: cnt_acct_id_nk
        tests: [not_null, unique]

  - name: int_owners__by_invest_acct
    description: One primary owner per investment account.
    columns:
      - name: cnt_acct_id_nk
        tests: [not_null, unique]

  - name: int_products__unified
    description: >
      Shared grain across the insurance and wealth branches. If this test
      fails, a producer left join has fanned out -- fix the join, do not add
      a distinct.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cnt_id_nk
              - cnt_iss_cd_nk
              - plan_cd
              - producer_id_nk
    columns:
      - name: lob_nm
        tests: [not_null]
      - name: cnt_id_nk
        tests: [not_null]

  - name: int_products__categorized
    columns:
      - name: product_type
        description: >
          Null means the plan_cd did not resolve to a row in
          product_category_map. The mart filters these out, so this test is
          the early warning that a new product has launched and nobody has
          added it to the seed yet.
        tests:
          - not_null:
              config:
                severity: warn

  - name: int_clients__active_eop
    columns:
      - name: po_client_id_nk
        tests: [not_null, unique]

  - name: int_planning__gm_clients
    columns:
      - name: client_id
        tests: [not_null, unique]

  - name: int_planning__fp_clients
    columns:
      - name: client_id
        tests: [not_null, unique]

  - name: int_clients__planning_flags
    description: >
      One row per client that has any completed plan, GM or fee-based.
    columns:
      - name: client_id
        tests: [not_null, unique]
      - name: completed_plan_dt
        tests: [not_null]

  # NOTE ON WHAT IS *NOT* TESTED BELOW
  # Every model in this directory is ephemeral, so a test here compiles to the
  # entire upstream CTE chain re-executed just to make one assertion -- 53 to 74
  # lines of SQL against 11 for the same assertion on a materialised mart.
  # Tests were therefore dropped where they either (a) duplicated a test on the
  # mart built directly from this model, or (b) could not fail, because a
  # `select distinct` / `group by` / `count()` in the model guarantees them.
  # What remains are the assertions that can actually fail and are not made
  # anywhere else -- chiefly the grain tests that catch producer fan-out.

  - name: int_metrics__base_all
    description: >
      Mapping rows for the reporting month, restricted to contracts effective
      on or before the month end. month_end_date and primry_ownr_cl_id are
      tested on ppg_metrics_dtl, which is built directly from this.

  - name: int_summ__active_clients
    description: >
      Clients holding at least one contract effective in the trailing 60 months.
      Grain is guaranteed by `select distinct month_end_date, primry_ownr_cl_id`
      in the model itself, so there is nothing left to assert.

  - name: int_summ__sales
    description: >
      One row per month. YTD new business counts and penetration rates. The
      month grain and total_sales are tested on ppg_metrics_summ_monthly.
    columns:
      - name: total_sales
        description: Denominator for all three penetration rates.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: int_summ__client_breadth_depth
    description: >
      Breadth and depth per client per month. Grain is guaranteed by the
      `group by 1, 2`; the range tests below are the ones that can fail.
    columns:
      - name: breadth_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: depth_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: int_summ__breadth_depth
    description: >
      Per-month rollup of client breadth and depth. Nothing asserted here:
      month_end_date is `group by 1` and tested on ppg_metrics_summ_monthly,
      and denominator is a count(distinct), which cannot be null.
