version: 2

models:

  - name: int_reporting_periods
    description: >
      ONE ROW: the report's calendar. Every other model cross-joins to it so
      that "today", "this week" and "start of year" mean the same thing
      everywhere. Materialized as a table rather than ephemeral so it can be
      inspected (`dbt show --select int_reporting_periods`) before anything
      downstream is trusted.

      The single-row guarantee is enforced by
      tests/assert_single_reporting_period.sql. It is not decoration: every
      downstream cross join doubles if a second row ever appears.
    columns:
      - name: cur_dt
        description: The as-of date, from stg_a360__load_control. The anchor for everything.
        data_tests: [not_null, unique]
      - name: yr_start_dt
        description: Three years before the start of the current year.
        data_tests: [not_null]
      - name: yr_end_dt
        description: Last day of the current year.
        data_tests: [not_null]
      - name: cur_yr
        description: First day of the current year. Lower bound of the YTD buckets.
        data_tests: [not_null]
      - name: prv_mnst
        description: First day of the prior month.
        data_tests: [not_null]
      - name: prv_me
        description: >
          Last day of the prior month. Upper bound of the _me bucket, which is
          "year to date through the end of last month".
        data_tests: [not_null]
      - name: cur_mnst
        description: First day of the current month. Lower bound of the MTD bucket.
        data_tests: [not_null]
      - name: curr_month_enddate
        description: Last day of the current month.
        data_tests: [not_null]
      - name: cw_start_dt
        description: >
          Sunday of the current week. Databricks' date_trunc('week') snaps to
          Monday; the model shifts it. See the header before changing it.
        data_tests: [not_null]
      - name: cw_end_dt
        description: Saturday of the current week.
        data_tests: [not_null]
      - name: prev_week_start
        description: Sunday of the prior week.
        data_tests: [not_null]
      - name: prev_week_end
        description: Saturday of the prior week.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          description: The year cannot start after the as-of date.
          arguments:
            expression: "cur_yr <= cur_dt"
      - dbt_utils.expression_is_true:
          description: The as-of date must fall inside the week labelled "current".
          arguments:
            expression: "cur_dt between cw_start_dt and cw_end_dt"
      - dbt_utils.expression_is_true:
          description: >
            The prior week must end the day before the current week starts. A
            gap or overlap here means the _cw and _pw buckets are double
            counting or dropping a day.
          arguments:
            expression: "prev_week_end = date_add(cw_start_dt, -1)"
      - dbt_utils.expression_is_true:
          description: Both week windows must be exactly seven days.
          arguments:
            expression: "datediff(cw_end_dt, cw_start_dt) = 6
                         and datediff(prev_week_end, prev_week_start) = 6"
      - dbt_utils.expression_is_true:
          description: The prior month must end the day before the current one starts.
          arguments:
            expression: "prv_me = date_add(cur_mnst, -1)"

  - name: int_fyc_by_marketer
    description: >
      First-year commission per marketer, pivoted into the five reporting
      periods by the period_buckets macro. One row per marketer with any
      commission in the current year.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests:
          - not_null
          - unique:
              description: >
                The mart left-joins this on mktr_no. A second row per marketer
                would duplicate the marketer in the mart.
          - relationships:
              arguments:
                to: ref('stg_a360__daily_fyc')
                field: mktr_no
      - name: fyc_me
        description: Year to date through the end of the prior month.
      - name: fyc_ytd
        description: Year to date through the as-of date.
      - name: fyc_mtd
        description: Current month through the as-of date.
      - name: fyc_cw
        description: Current week (Sunday to Saturday).
      - name: fyc_pw
        description: Prior week.
    data_tests:
      - dbt_utils.expression_is_true:
          description: >
            The MTD window is contained in the YTD window, so MTD cannot exceed
            YTD -- unless chargebacks made the earlier part of the year
            negative, which is possible and is why this warns rather than
            errors. Nulls mean the marketer had no activity in that window.
          arguments:
            expression: "coalesce(fyc_mtd, 0) <= coalesce(fyc_ytd, 0)"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          description: >
            The current-week window is contained in MTD only when the week does
            not straddle a month boundary, so this compares against YTD, which
            always contains it.
          arguments:
            expression: "coalesce(fyc_cw, 0) <= coalesce(fyc_ytd, 0)"
          config:
            severity: warn

  - name: int_paid_cases_by_marketer
    description: >
      Paid life cases per marketer, in the same five periods as FYC. Restricted
      to product line 'LF' via an inner join to the product dimension -- see the
      model header, this is the left-join-plus-where from the original made
      explicit.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_a360__daily_paid_cases')
                field: mktr_no
      - name: cases_me
        description: Year to date through the end of the prior month.
      - name: cases_ytd
        description: Year to date through the as-of date.
      - name: cases_mtd
        description: Current month through the as-of date.
      - name: cases_cw
        description: Current week.
      - name: cases_pw
        description: Prior week.
    data_tests:
      - dbt_utils.expression_is_true:
          description: >
            Unlike commission, case counts cannot be negative, so the window
            containment is a hard rule here rather than a warning.
          arguments:
            expression: "coalesce(cases_mtd, 0) <= coalesce(cases_ytd, 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(cases_me, 0) <= coalesce(cases_ytd, 0)"

  - name: int_class_by_marketer
    description: >
      Point-in-time class lookup: the marketer's class code as at each of the
      four reporting dates. One row per marketer that has any class history
      overlapping an active contract status.

      A null in any of the four columns means the marketer had no class row
      covering that date -- which is a real answer, not an error, so these
      columns are not not_null tested.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests:
          - not_null
          - unique:
              description: Grouped to one row per marketer; the mart left-joins on it.
      - name: cw_class
        description: Class as at the start of the current week.
        data_tests:
          - accepted_values:
              description: A class code with no label renders as 'Other'; warn, do not fail.
              arguments:
                values: [1, 2, 3, 4, 5, 10]
                quote: false
              config:
                severity: warn
      - name: pw_class
        description: Class as at the start of the prior week.
      - name: prvme_class
        description: Class as at the end of the prior month.
      - name: cur_class
        description: Class as at the as-of date.
        data_tests:
          - dbt_utils.at_least_one:
              description: >
                All four class columns null for every marketer means the
                point-in-time windows and the reporting dates do not overlap at
                all -- a silent failure, since null is a legitimate value here.
          - accepted_values:
              description: A class code with no label renders as 'Other'; warn, do not fail.
              arguments:
                values: [1, 2, 3, 4, 5, 10]
                quote: false
              config:
                severity: warn

  - name: int_marketer_contract
    description: >
      The marketer's contract as at the reporting month, with the 9999
      open-ended sentinel resolved to the end of the current year so that the
      BETWEEN comparisons in the mart behave.

      Filtered to the ten active status codes and to the row in
      force at the start of the reporting month, which is what makes it one row
      per marketer.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests:
          - not_null
          - unique:
              description: >
                Depends on contract windows not overlapping (tested in staging)
                and on the active-status list not containing two statuses a
                marketer can hold at once. If this fails the mart fans out.
          - dbt_utils.at_least_one:
              description: >
                An empty model here is not an error anywhere downstream -- the
                mart left-joins it, so every contractenddate simply comes out
                null and every active flag comes out 0. That has happened once
                already, from a status-code format mismatch. See also
                tests/assert_report_is_not_vacuous.sql.
      - name: mk_sts_tp_cd
        description: The contract status in force for the reporting month.
        data_tests: [not_null]
      - name: mk_sts_atv_edt
        description: '{{ doc("valid_from") }}'
        data_tests: [not_null]
      - name: contractenddate
        description: >
          Contract end date. Open-ended contracts get the last day of the
          current reporting year, not 9999-12-31, so that "still under contract
          at period end" comparisons stay meaningful.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "contractenddate >= mk_sts_atv_edt"

  - name: int_triggered_marketers
    description: >
      Marketers whose recruiting credit triggered in the current year to date,
      with the contract type in force on the trigger date and the recruiter's
      display name. The `trig` CTE of the CAP query.

      Every join is inner, so this model is a filter as much as a join -- read
      the model header for the four ways a marketer can silently disappear from
      it before investigating a missing row in fct_cap_candidate.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }} The recruited marketer.'
        data_tests:
          - not_null
          - unique:
              description: >
                One trigger row per marketer. This can only fail through
                overlapping contract windows (or duplicate marketer history),
                and when it does, every candidate under that marketer is
                counted twice in the CAP report. Fix the window; do not
                deduplicate downstream.
          - dbt_utils.at_least_one:
              description: >
                Empty here means an empty CAP report. The likeliest causes are
                a load-control date outside the trigger window and a contract
                type lookup that stopped matching -- both silent, both
                indistinguishable from "nobody triggered this year" without
                this test.
      - name: rcr_no
        description: The recruiting marketer whose name carries the credit.
        data_tests: [not_null]
      - name: rcr_name
        description: >
          Recruiter's display name, initcap'd, built from the dashboard
          dimension. The mart prefers EDH's own recruiter name over it.
      - name: orig_org_unit_cd
        description: The marketer's original org unit. Resolves to office and zone in the mart.
      - name: split
        description: Share of the recruiting credit.
      - name: rcr_elig_dt
        description: The trigger date. Always inside the current year to date, by construction.
        data_tests: [not_null]
      - name: ea_pgm_ind
        description: Enhanced-agreement indicator, from the marketer master.
      - name: mk_cnt_tp_nm
        description: Contract type in force on the trigger date.
        data_tests: [not_null]

  - name: int_candidate_cap_score
    description: >
      The candidate chain of the CAP query -- producer to EPM case to lead to
      assessment to contract -- rooted at the producer bridge so it can be run
      and inspected on its own.

      GRAIN: one row per producer per case per live lead per live assessment.
      A twice-assessed candidate is two rows here and two rows in the mart. If
      only the latest assessment should count, that rule belongs in this model.
    columns:
      - name: producer_mktr_no
        description: >
          The a360 marketer number the chain hangs off, normalised in staging.
          Never null -- the model drops the rows where it would be.
        data_tests: [not_null]
      - name: candidate_id
        description: >
          Candidate natural key. Null for a producer whose case has no live
          lead; those rows exist so the gap can be counted, and the mart's
          score filter removes them.
      - name: fit_score_val
        description: The CAP score as stored. Reported by the mart as cap_score.
      - name: fit_score_val_num
        description: The score as a decimal, for the 75 threshold.
      - name: cap_date
        description: Assessment completion date, as a date.
      - name: cap_score_75plus
        description: >
          "Y" when the score is 75 or better. A non-numeric score is "N".
        data_tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: can_full_nm_protected
        description: >
          The candidate's name, still protected. Decrypted only in
          fct_cap_candidate.
      - name: pts_date
        description: >
          Effective date of the marketer's contract as of the report date. Null
          when no contract covers it, which is normal for a lapsed marketer.
