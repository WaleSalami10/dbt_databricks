version: 2

models:
  - name: ppg_stg_cnt_prd_mapping
    description: >
      One row per in-scope contract or investment account per REPORTING MONTH,
      with product categorisation attached. Feeds ppg_metrics_dtl. Was keyed by
      a daily snapshot_date, which did not match the monthly grain of every
      table downstream of it.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month_end_date
              - cnt_id_nk
              - cnt_iss_cd_nk
              - producer_id_nk
    columns:
      - name: month_end_date
        tests: [not_null]
      - name: snapshot_date
        description: >
          Audit only: the date PDM was observed. Not a key, and nothing joins
          on it. In pdm_history_mode 'current' it is the run date and will be
          LATER than month_end_date -- assert_snapshot_is_month_end.sql reports
          the drift. In every other mode it equals month_end_date.
        tests: [not_null]
      - name: cnt_id_nk
        tests: [not_null]
      - name: lob_nm
        tests:
          - accepted_values:
              arguments:
                values:
                  - LIFE INSURANCE
                  - ANNUITIES
                  - LONG TERM CARE
                  - IDI
                  - EAGLE
                  - NYLIFE SEC
                  - MAINSTAY
                  - NP MUTFNDS
                  - NP529
      - name: product_type
        tests: [not_null]
      - name: product_category_risk_wm
        tests:
          - accepted_values:
              arguments:
                values: ['Risk Management', 'Wealth Management']

  - name: ppg_metrics_dtl
    description: >
      Contract-level detail for the reporting month, filtered to contracts whose
      primary owner was an active policy owner at month end.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month_end_date
              - cnt_id_nk
              - cnt_iss_cd_nk
              - producer_id_nk
      - dbt_utils.expression_is_true:
          description: >
            risk_management_ind and wealth_management_ind are derived from the
            same column and are mutually exclusive by construction. If both are
            'N' a new value has appeared in product_category_risk_wm.
          arguments:
            expression: "not (risk_management_ind = 'N' and wealth_management_ind = 'N')"
    columns:
      - name: month_end_date
        tests: [not_null]
      - name: cnt_id_nk
        tests: [not_null]
      - name: primry_ownr_cl_id
        tests: [not_null]
      - name: gm_flag
        tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: fp_flag
        tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: gm_or_fp_flag
        tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']

  - name: ppg_metrics_monthly
    description: >
      ppg_metrics_dtl with cnt_iss_cd_nk and producer_cnt_role_nm dropped. A
      pure projection -- there is NO deduplication, matching the original
      notebook, so duplicate rows are expected wherever two dtl rows differed
      only in those two columns. This table therefore has no unique key.
      Count contracts with count(distinct cnt_id_nk), never with count(*).
      Accumulates one partition per reporting month; feeds
      ppg_metrics_summ_monthly.
    tests:
      - dbt_utils.unique_combination_of_columns:
          description: >
            WARN, NOT ERROR, AND NOT A GRAIN ASSERTION. Without a `distinct`
            this combination is genuinely not unique, so this test is expected
            to fail -- it is here to keep the duplication VISIBLE and to
            quantify it, rather than to forbid it.

            A failure means either one cnt_id_nk exists under two issue codes,
            or one contract carries the same producer under several roles.
            Both are real modelling questions -- README item 4 and the Grain
            section -- and both would be fixed at source rather than by adding
            a `distinct` back here. When they are fixed, this test starts
            passing on its own and can be promoted to error.
          arguments:
            combination_of_columns:
              - month_end_date
              - cnt_id_nk
              - producer_id_nk
          config:
            severity: warn
      - dbt_utils.equal_rowcount:
          description: >
            A projection does not change cardinality, so with the `distinct`
            removed this should now match EXACTLY for any month built in the
            same run. It stays a warning only because the two tables can hold
            different sets of months if one is backfilled without the other.
          arguments:
            compare_model: ref('ppg_metrics_dtl')
          config:
            severity: warn
    columns:
      - name: month_end_date
        tests: [not_null]
      - name: cnt_id_nk
        tests: [not_null]
      - name: primry_ownr_cl_id
        tests: [not_null]
      - name: gm_or_fp_flag
        tests:
          - accepted_values:
              arguments:
                values: ['Y', 'N']

  - name: ppg_metrics_summ_monthly
    description: >
      One row per reporting month: YTD sales penetration plus multi-product
      breadth and depth. Reads ppg_metrics_dtl directly, not
      ppg_metrics_monthly.
    columns:
      - name: month_end_date
        tests: [not_null, unique]
      - name: total_sales
        tests: [not_null]
      - name: plan_sales
        description: >
          Distinct clients with a GM or FP plan. Cannot exceed total_sales.
        tests: [not_null]
      - name: ppg_sales
        description: Percentage, 0-100.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: gm_led_sales
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: fb_led_sales
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: multi_product_breadth
        description: >
          Mean distinct need-based categories per active client. Below 1.0 would
          mean a client counted in the denominator contributed no categories.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
              config:
                severity: warn
      - name: multi_product_depth
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
              config:
                severity: warn
    tests:
      - dbt_utils.expression_is_true:
          description: Plan sales is a subset of total sales.
          arguments:
            expression: "plan_sales <= total_sales"
      - dbt_utils.expression_is_true:
          description: >
            Depth counts contracts, breadth counts categories. A client cannot
            span more categories than they hold contracts, so depth >= breadth
            at the aggregate level too.
          arguments:
            expression: "depth_val >= breadth_val"
          config:
            severity: warn
