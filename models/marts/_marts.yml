version: 2

models:

  - name: fct_marketer_production
    description: >
      One row per marketer: who they are, where they sit in the org, and what
      they produced across the five reporting periods (prior-month-end YTD, YTD,
      MTD, current week, prior week).

      This is the replacement for the final SELECT of FOD_query.sql. The
      marketer's identity columns describe their RECRUITER, not themselves --
      the report is a recruiter-level view, which is why the dashboard table is
      self-joined. Read the README's "four things to confirm" section before
      treating any of these numbers as authoritative.
    config:
      contract:
        enforced: false
    columns:

      - name: mktr_no
        description: '{{ doc("mktr_no") }} Here, the producing marketer.'
        data_tests:
          - not_null
          - unique:
              description: >
                The grain, and the test that replaced the original `select
                distinct`. A duplicate here means one of the joins has fanned
                out -- almost certainly appointment history or contract status.
                Fix the join; do not re-add the distinct.
      - name: rel_mktr_no
        description: The recruiting marketer whose name, title and office appear on the row.
        data_tests: [not_null]
      - name: abreviated_nm
        description: Recruiter's short display name.
      - name: mk_fst_nm
        description: Recruiter's first name.
      - name: mk_lst_nm
        description: Recruiter's last name.
      - name: ttl_nm
        description: >
          Recruiter's title. Always one of the five reportable titles -- this
          model filters on that list, so the test below restates the filter and
          fails only if the filter itself stops being applied.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Managing Partner', 'Partner', 'Senior Partner',
                         'Executive Partner', 'Associate Partner']
      - name: go_nm
        description: Recruiter's general office.
        data_tests: [not_null]
      - name: zn_nm
        description: Recruiter's zone.
        data_tests: [not_null]

      - name: mk_cls_tp_cd
        description: The producer's current class code, from the dashboard dimension.
      - name: cls_copy
        description: >
          Display label for mk_cls_tp_cd, from the CASE block in this model.
          A code with no entry in that var renders as 'Other' rather than null,
          matching the ELSE in FOD_query.sql; staging warns when it happens.

      - name: orig_appt_dt
        description: Original appointment date.
        data_tests: [not_null]
      - name: contractenddate
        description: >
          Contract end date, sentinel resolved. Null means no active contract
          row for the reporting month, which is legitimate for a terminated
          marketer who still has production earlier in the year.
      - name: start_6mo
        description: First day of the month the marketer was appointed in.
        data_tests: [not_null]
      - name: end_6mo
        description: Month end, six months after appointment.
        data_tests: [not_null]

      - name: prorata
        description: 1 if the marketer counts pro rata toward headcount, else 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: count_active
        description: Manpower active-headcount flag. Null where there is no manpower row.
      - name: prior_prorata
        description: >
          ALWAYS IDENTICAL TO prorata. The original joins manpower twice on the
          same key with no distinguishing predicate, so the second join returns
          the same row as the first. Reproduced from FOD_query.sql line 132; it
          is not a prior-period value and should not be read as one until the
          mpr join gets a date predicate. See the model header and the README.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
          - dbt_utils.expression_is_true:
              description: >
                States the duplication as a test rather than only in prose. When
                someone gives mpr a real prior-period predicate this fails, which
                is the signal to delete this test and the warnings around it.
              arguments:
                expression: "prior_prorata = prorata"

      - name: fyc_me
        description: First-year commission, year to date through the end of the prior month.
        data_tests: [not_null]
      - name: fyc_ytd
        description: First-year commission, year to date through the as-of date.
        data_tests: [not_null]
      - name: fyc_mtd
        description: First-year commission, current month to the as-of date.
        data_tests: [not_null]
      - name: fyc_cw
        description: First-year commission, current week.
        data_tests: [not_null]
      - name: fyc_pw
        description: First-year commission, prior week.
        data_tests: [not_null]

      - name: cases_me
        description: Paid life cases, year to date through the end of the prior month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: cases_ytd
        description: Paid life cases, year to date through the as-of date.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: cases_mtd
        description: Paid life cases, current month to the as-of date.
        data_tests: [not_null]
      - name: cases_cw
        description: Paid life cases, current week.
        data_tests: [not_null]
      - name: cases_pw
        description: Paid life cases, prior week.
        data_tests: [not_null]

      - name: cw_class
        description: Class code as at the start of the current week.
      - name: pw_class
        description: Class code as at the start of the prior week.
      - name: prvme_class
        description: Class code as at the end of the prior month.
      - name: cur_class
        description: Class code as at the as-of date.

      - name: cur_dt
        description: >
          The as-of date the whole row was built against. Constant across the
          table -- carried so a consumer can tell which run they are reading.
        data_tests: [not_null]

      - name: prevmonthflg_sixmth
        description: >
          'Y' if the marketer was inside their first six months, and still under
          contract, at the end of the prior month.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: currmonthflg_sixmth
        description: Same test, evaluated at the current month end.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']

      - name: active_prvme
        description: 1 if actively contracted at the end of the prior month.
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: active_mtd
        description: >
          1 if actively contracted on the as-of date. NOTE: identical to
          active_ytd by construction -- both test cur_dt. Preserved from the
          original, which is very likely a copy-paste slip. See the README.
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: active_ytd
        description: Identical to active_mtd. See above.
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: active_cw
        description: 1 if actively contracted at the start of the current week.
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: activet_pw
        description: 1 if actively contracted at the start of the prior week.
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}

    data_tests:
      - dbt_utils.expression_is_true:
          description: The six-month window must end after it starts.
          arguments:
            expression: "end_6mo > start_6mo"
      - dbt_utils.expression_is_true:
          description: >
            active_mtd and active_ytd are the same expression in the source
            model. This test exists to FAIL the day someone fixes one of them
            without reading the README -- at which point delete the test along
            with the note on active_mtd.
          arguments:
            expression: "active_mtd = active_ytd"
      - dbt_utils.expression_is_true:
          description: Case counts are non-negative, so YTD contains MTD.
          arguments:
            expression: "cases_mtd <= cases_ytd"
      - dbt_utils.expression_is_true:
          description: >
            Every marketer on the report is inside their recruiter's downline,
            and a marketer cannot produce before being appointed.
          arguments:
            expression: "orig_appt_dt <= cur_dt"
      - dbt_utils.fewer_rows_than:
          description: >
            The report is a filtered subset of the dashboard dimension -- by
            title, by dashboard status, and by having an appointment record. It
            can never have more rows than the dimension it filters.
          arguments:
            compare_model: ref('stg_a360__marketer_dashboard')

  - name: fct_cap_candidate
    description: >
      One row per triggered marketer per candidate assessment: the CAP scores of
      candidates attached to marketers whose recruiting credit triggered this
      year, with the office, zone and recruiter that credit belongs to.

      The replacement for the CAP query. It is NOT one row per candidate: a
      candidate assessed twice appears twice, and a candidate attached to two
      triggered marketers appears once per marketer. Deduplicate deliberately if
      a count of candidates is what you need -- see the grain note on
      int_candidate_cap_score.

      triggered_flg and ytd_trigger are constant 'Y'. They are reproduced from
      the original, and the tests below pin them so that stops being invisible.
      Read the model header before using either.
    config:
      contract:
        enforced: false
    columns:

      - name: mktr_no
        description: '{{ doc("mktr_no") }} Here, the triggered marketer.'
        data_tests: [not_null]
      - name: rcr_no
        description: The recruiting marketer the credit belongs to.
        data_tests: [not_null]
      - name: candidate_id
        description: >
          The assessed candidate. Never null on the report: the score filter
          removes rows that got this far without a candidate.
        data_tests: [not_null]
      - name: marketer_id
        description: EDH marketer id the candidate is attached to (can_mktr_id).
      - name: recrt_mktr_id
        description: Recruiting marketer id as EDH records it.
      - name: recruiter_name
        description: >
          The ODS recruiter name, falling back to the a360 name when the ODS has
          none. Null only if both are missing.
      - name: candidate_name
        description: >
          The candidate's name, decrypted here and nowhere else -- this is the
          only model in the project that calls
          protegrity.unprotect_clientname(), and the only one that materialises
          names into a table. Whoever can select this table can read them, so
          grant on it deliberately. No test reads this column on purpose: a
          failing test writes sample rows to the failures schema.

      - name: zone_cd
        description: Zone code of the marketer's ORIGINAL org unit.
      - name: go_code
        description: Original org unit code -- the report's general-office code.
      - name: go_nm
        description: General office name.
      - name: zone_name
        description: Zone name.

      - name: split
        description: Share of the recruiting credit, passed through from marketer history.
      - name: stage
        description: The candidate's pipeline stage (can_stg_nm).
      - name: cap_date
        description: Date the assessment was completed.
      - name: cap_score
        description: >
          The CAP fit score, exactly as the source stores it -- text, not a
          number. Cast it before comparing, or use cap_score_75plus.
        data_tests: [not_null]
      - name: cap_score_75plus
        description: '"Y" when the score is 75 or better.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: pts_date
        description: >
          Effective date of the candidate's marketer's current contract. Null
          when no contract covers the report date.
      - name: cur_dt
        description: >
          The report's as-of date, from the calendar. Constant across the table,
          carried so a saved extract still says what day it describes.
        data_tests: [not_null]

      - name: triggered_flg
        description: >
          Constant 'Y'. Tests a column that cannot be null on the driving table
          of an inner-joined CTE. Kept for compatibility with the original
          query; see the model header.
        data_tests:
          - accepted_values:
              description: >
                Pins the constant. The day this fails, the model has started
                including untriggered marketers -- which is a real improvement,
                not a defect. Delete this test and the header note together.
              arguments:
                values: ['Y']
      - name: ytd_trigger
        description: >
          Constant 'Y'. int_triggered_marketers has already filtered the trigger
          date to the current year to date, so this restates a filter rather
          than testing anything.
        data_tests:
          - accepted_values:
              description: As with triggered_flg -- pins a constant so it cannot drift unnoticed.
              arguments:
                values: ['Y']

      - name: ea_pgm_ind
        description: >
          Enhanced-agreement indicator. Every row on the report has this = 'T'
          or a '%TAS%' contract type; the two are not exclusive.
      - name: mk_cnt_tp_nm
        description: Contract type in force on the trigger date.
        data_tests: [not_null]

    data_tests:
      - dbt_utils.expression_is_true:
          description: >
            Restates the qualifying rule. It fails only if the WHERE clause
            stops being applied -- which is exactly the change worth catching,
            since dropping it widens the report silently rather than emptying it.
          arguments:
            expression: "ea_pgm_ind = 'T' or mk_cnt_tp_nm like '%TAS%'"
      - dbt_utils.expression_is_true:
          description: >
            The 75+ flag agrees with the score it is derived from. Guards the
            text-to-decimal cast: a score column that stops parsing makes every
            flag 'N' while cap_score still looks fine.
          arguments:
            expression: >
              cap_score_75plus =
                case when cast(cap_score as decimal(10,2)) >= 75 then 'Y' else 'N' end
      - dbt_utils.expression_is_true:
          description: An assessment cannot have been completed after the report date.
          arguments:
            expression: "cap_date <= cur_dt"
          config:
            severity: warn
