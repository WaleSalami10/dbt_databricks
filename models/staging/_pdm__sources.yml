version: 2

sources:
  - name: pdm
    database: prod_execution_rs
    schema: ext_pdm
    description: >
      Enterprise Data Hub PDM layer. Every table here carries
      edh_record_status_in; the staging models filter to 'A' once so that
      downstream models never have to repeat it.
    tables:
      - name: dim_date
      - name: dim_contract
      - name: fact_primary_owner_derv
      - name: fact_contract_cmpnt_producer
      - name: dim_invest_sub_account
      - name: fact_invest_account_sub_account
      - name: dim_invest_account
      - name: fact_invest_account_producer_role
      - name: dim_product

  - name: metrics_marketplace
    database: prod_execution_metrics_marketplace
    schema: metrics359
    tables:
      - name: rpt_fct_mk_cnt_cmpnt_po_all
        description: >
          Policy-owner fact at end-of-period. dim_po_status_sk in (1,2,3)
          means an active client. Its freshness gates the dbt Cloud job: the
          pipeline only builds when this table has been written to since the
          job's last successful run (see README, "Orchestration").
        config:
          # "Last updated" = timestamp of the latest Delta commit that changed
          # data. Not the metadata default: on Unity Catalog that reads
          # information_schema.tables.last_altered, which only moves on DDL,
          # so it would never see a load. Table maintenance (OPTIMIZE, VACUUM,
          # property changes, incl. predictive optimization) is excluded so it
          # cannot trigger a rebuild on unchanged data.
          loaded_at_query: |
            select max(timestamp)
            from (describe history {{ this }})
            where operation not in (
              'OPTIMIZE', 'VACUUM START', 'VACUUM END',
              'SET TBLPROPERTIES', 'UNSET TBLPROPERTIES', 'UPGRADE PROTOCOL'
            )
          # Loaded monthly: warn if the next load is ~5 days late, error if
          # ~2 weeks late. Only drives alerting; the build gate compares load
          # times, not these thresholds.
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}

  - name: crm
    database: prod_execution_datalake
    schema: lake_int_crm_salescentral
    tables:
      - name: sf_account

  - name: digital
    database: prod_execution_fieldexperience
    schema: digital
    tables:
      - name: mt__gm_ppg_plan_dates
        description: Guided Meeting plan completion dates, keyed by salesforce_id.

  - name: fx_test
    database: prod_builder_fieldexperience
    schema: fx_test
    tables:
      - name: ppg_feebased_fp_plans_by_agent
        description: >
          Fee-based FP plans. Built outside this project; see
          stg_fx__feebased_fp_plans for the caveat.

  - name: ppg_legacy
    database: prod_builder_fieldexperience
    schema: ppg
    tables:
      - name: ppg_metrics_dtl_hist
        description: >
          Pre-migration contract detail history. Only read when
          ppg_var('include_historical_load') is true. Nothing in this project
          builds it; it exists to be folded into ppg_metrics_monthly once.
