version: 2

sources:
  - name: a360
    description: >
      Agency 360 mart, landed by the upstream EDW load. Every table here is
      read-only from dbt's point of view.

      With `use_dummy_data: true` these definitions point instead at the
      stand-in tables written by scripts/load_dummy_data.py, which carry the
      same names and column types -- see the README. Only the catalog and
      schema move; nothing else in the project is aware of the switch.

    # Templated rather than swapped by a macro: the stand-ins are named after
    # the real tables, so redirecting them is a matter of catalog and schema,
    # which is what source config is already for. Read at parse time, so the
    # var has to come from --vars or dbt_project.yml.
    database: "{{ target.database if var('use_dummy_data', false) else 'prod_execution_rs' }}"
    schema: "{{ var('dummy_schema', target.schema ~ '_dummy_a360') if var('use_dummy_data', false) else 'ext_agy_a360_mart' }}"

    tables:
      - name: orap10_data_src_load_ctrl
        description: >
          Load-control table. One row per (target system, data subject) telling
          us the date that feed was last loaded. This is the source of truth for
          "as of when" the whole report is built.
        config:
          # Cast because freshness requires a timestamp and this column is a
          # date. Harmless if the real column is already a timestamp.
          loaded_at_field: "cast(ld_dt as timestamp)"
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 48, period: hour}
        columns:
          - name: tgt_sys_nm
            description: Target system. The report reads the 'DASHBOARD' rows.
          - name: common_data_name
            description: >
              Data subject the row tracks. The report reads
              'Life Premium/Paid Cases'.
          - name: ld_dt
            description: Date the feed last landed. The report's as-of date.

      - name: orap10_mk_daly_fyc_join_mv
        description: Daily first-year-commission summary, one row per marketer per day.
        config:
          loaded_at_field: "cast(fyc_smy_edt as timestamp)"
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 96, period: hour}
        columns:
          - name: mktr_no
            description: Marketer number. Joins to orap10_mk_dashbrd.
          - name: fyc_smy_edt
            description: Summary effective date the commission is bucketed by.
          - name: mk_shr_fyc_am
            description: >
              The marketer's SHARE of the first-year commission, not the gross
              amount. Splits are already applied upstream, so summing this
              across marketers is the correct total.

      - name: orap10_mk_daly_ctcp_prm_smy
        description: >
          Daily paid-case / premium summary, one row per marketer per day per
          product.
        columns:
          - name: mktr_no
          - name: ctcp_prm_smy_edt
            description: Summary effective date the case is bucketed by.
          - name: alt_prdt_cd
            description: Product code. Joins to orap10_dash_alt_prdt_mv.
          - name: mk_shr_ctcp_sld_qy
            description: >
              The marketer's SHARE of the sold-case quantity. As with FYC, the
              split is applied upstream.

      - name: orap10_dash_alt_prdt_mv
        description: Product dimension. Used to filter paid cases to life products.
        columns:
          - name: alt_prdt_cd
            description: Product code, unique.
          - name: alt_prdt_line_cd
            description: Product line. 'LF' is life, which is all the report counts.

      - name: orap10_mk_cls_hist
        description: >
          Slowly-changing history of a marketer's class (career level), with
          mk_cls_edt / mk_cls_xdt marking the effective window of each row.
        columns:
          - name: mktr_no
          - name: mk_cls_tp_cd
            description: Class code. Labelled by the CASE block in fct_marketer_production.
          - name: mk_cls_edt
            description: Window start, inclusive.
          - name: mk_cls_xdt
            description: Window end, inclusive.

      - name: orap10_mk_sts_atv
        description: >
          Marketer contract status history, with mk_sts_atv_edt / mk_sts_atv_xdt
          marking the effective window. An xdt containing 9999 means "open ended".
        columns:
          - name: mktr_no
          - name: mk_sts_tp_cd
            description: >
              Contract status. int_class_by_marketer and
              int_marketer_contract decide which of these count as active.
          - name: mk_sts_atv_edt
            description: Window start, inclusive.
          - name: mk_sts_atv_xdt
            description: >
              Window end, inclusive. Contains a 9999 sentinel for open-ended
              contracts, which is why staging keeps it as text as well as a
              timestamp.

      - name: orap10_mk_dashbrd
        description: >
          Marketer dashboard dimension. Note this table is joined to itself in the
          original query: rel_mktr_no points at the related (recruiting) marketer.
        columns:
          - name: mktr_no
            description: Marketer number, unique.
          - name: rel_mktr_no
            description: >
              The related (recruiting) marketer. The report is grouped by this
              marketer's name, title and office.
          - name: mk_cls_tp_cd
          - name: mk_ttl_tp_cd
            description: Title code. Joins to orap10_mk_ttl_tp.
          - name: mk_sts_tp_cd
            description: >
              Dashboard status. Filtered to ('01', '04', '1C') in
              fct_marketer_production.
          - name: alt_org_unit_cd
            description: Org unit. Joins to orap10_cur_go_zone.
          - name: abreviated_nm
            description: Short display name. Source spelling kept deliberately.
          - name: mk_fst_nm
          - name: mk_lst_nm

      - name: orap10_mk_history
        description: >
          Marketer history. Source of the original appointment date, and of the
          recruiting relationship (rel_mktr_no / split / rcr_elig_dt) the CAP
          models are built on. Assumed one row per marketer -- see the unique
          test on stg_a360__marketer_appointment.
        columns:
          - name: mktr_no
          - name: orig_appt_dt
            description: >
              Original appointment date. Drives the six-month new-agent window
              and every "actively contracted on date X" flag in the mart.
          - name: rel_mktr_no
            description: >
              The related (recruiting) marketer. Joined to orap10_mk_dashbrd to
              get the recruiter's name in int_triggered_marketers.
          - name: orig_org_unit_cd
            description: >
              The marketer's original org unit. fct_cap_candidate resolves the
              office and zone from THIS, not from the current unit.
          - name: split
            description: Share of the recruiting credit, carried through to the mart as-is.
          - name: rcr_elig_dt
            description: >
              Recruiting-eligibility date -- the date the recruiting credit
              triggered. int_triggered_marketers keeps only rows whose value
              falls in the current year to date.

      - name: orap10_cur_go_zone
        description: General office and zone lookup.
        columns:
          - name: org_unit_cd
          - name: org_unit_nm
            description: General office name. Aliased to go_nm downstream, as in the source query.
          - name: zone_nm

      - name: orap10_mk_ttl_tp
        description: Job title lookup.
        columns:
          - name: mk_ttl_tp_cd
          - name: mk_ttl_tp_nm
            description: >
              Display text. The report matches the reportable-title list against
              an initcap() of this, not against the code -- see the README.

      - name: orap10_mk_manpower
        description: Manpower / headcount flags, including pro-rata indicators.
        columns:
          - name: mktr_no
          - name: pro_rata_ind
          - name: count_active

      - name: orap10_mk_cnt_atv
        description: >
          Marketer CONTRACT history (distinct from orap10_mk_sts_atv, which is
          status history), with mk_cnt_edt / mk_cnt_xdt marking the effective
          window. int_triggered_marketers uses it to find the contract in force
          on the marketer's recruiting-eligibility date.
        columns:
          - name: mktr_no
          - name: mk_cnt_tp_cd
            description: Contract type. Joins to orap10_mk_cnt_tp.
          - name: mk_cnt_edt
            description: Window start, inclusive.
          - name: mk_cnt_xdt
            description: >
              Window end, inclusive. Assumed to carry the same 9999 sentinel as
              the status table; staging resolves it the same way.

      - name: orap10_mk_cnt_tp
        description: Contract type lookup.
        columns:
          - name: mk_cnt_tp_cd
          - name: mk_cnt_tp_nm
            description: >
              Display text. fct_cap_candidate matches '%TAS%' against it, which
              is text matching and as fragile as the title matching -- see the
              README.

      - name: orap10_marketer
        description: >
          Marketer master. The CAP query joins it for ea_pgm_ind alone; that
          join is also what restricts the trigger population to marketers
          present in the master.
        columns:
          - name: mktr_no
          - name: ea_pgm_ind
            description: >
              Enhanced-agreement program indicator. 'T' is one of the two ways a
              row qualifies for fct_cap_candidate.

      - name: orap10_cur_go_zone_vg
        description: >
          General office and zone lookup, the _vg variant. Unlike
          orap10_cur_go_zone it also carries zone_cd. The CAP query joins this
          one on the marketer's ORIGINAL org unit; the production report joins
          the other on the recruiter's current one. They are not
          interchangeable.
        columns:
          - name: org_unit_cd
          - name: org_unit_nm
            description: General office name. Aliased to go_nm downstream.
          - name: zone_cd
          - name: zone_nm
