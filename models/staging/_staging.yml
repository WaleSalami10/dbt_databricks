version: 2

models:

  - name: stg_a360__load_control
    description: >
      ONE ROW: the date the report is as of, taken from the load date of the
      DASHBOARD / 'Life Premium/Paid Cases' row in load control (or pinned by
      the `snapshot_date` var on a backfill).
      Everything in the project ultimately anchors on this value, so a fault
      here is a fault everywhere -- hence the row-count test.
    columns:
      - name: ld_dt
        description: The report's as-of date. Never current_date.
        data_tests:
          - not_null:
              description: >
                Null means that row is missing from load control.
                The calendar would then be entirely null and every period
                bucket would come back empty rather than wrong, which is worse.
    data_tests:
      - dbt_utils.equal_rowcount:
          description: One row in, one row out. The whole calendar depends on it.
          arguments:
            compare_model: ref('int_reporting_periods')

  - name: stg_a360__daily_fyc
    description: >
      Daily first-year commission. One row per marketer per day, unfiltered --
      int_fyc_by_marketer applies the year window and the period bucketing.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null]
      - name: fyc_smy_edt
        description: Transaction date the commission is bucketed by.
        data_tests: [not_null]
      - name: mk_shr_fyc_am
        description: >
          First-year commission. Can legitimately be negative -- a chargeback
          reverses a prior payment -- so there is no positive-value test here.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          description: >
            The documented grain. If this fails the source has started issuing
            multiple rows per marketer per day; the sums downstream still work,
            but the freshness assumption and any per-day reconciliation do not.
          arguments:
            combination_of_columns: [mktr_no, fyc_smy_edt]

  - name: stg_a360__daily_paid_cases
    description: >
      Daily paid cases and premium. One row per marketer per day per product.
      The life-product filter is applied downstream, in
      int_paid_cases_by_marketer, because the product line lives on the product
      dimension rather than on this table.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null]
      - name: alt_prdt_cd
        description: '{{ doc("alt_prdt_cd") }}'
        data_tests:
          - not_null
          - relationships:
              description: >
                A case whose product is missing from the dimension is dropped by
                the inner join in int_paid_cases_by_marketer -- silently, and
                only from the life-product counts. This test is the alarm.
              arguments:
                to: ref('stg_a360__product')
                field: alt_prdt_cd
      - name: ctcp_prm_smy_edt
        description: Paid date. The date a case is bucketed by.
        data_tests: [not_null]
      - name: mk_shr_ctcp_sld_qy
        description: Number of paid cases.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [mktr_no, ctcp_prm_smy_edt, alt_prdt_cd]

  - name: stg_a360__product
    description: Product dimension, one row per product code.
    columns:
      - name: alt_prdt_cd
        description: '{{ doc("alt_prdt_cd") }}'
        data_tests: [not_null, unique]
      - name: alt_prdt_line_cd
        description: >
          Product line, upper-cased. 'LF' is the life line, the only one the
          paid-case counts include.
        data_tests: [not_null]

  - name: stg_a360__class_history
    description: >
      Marketer class history. Type-2: one row per marketer per class, valid
      between mk_cls_edt and mk_cls_xdt inclusive.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null]
      - name: mk_cls_tp_cd
        description: Class code. Labelled by the CASE block in fct_marketer_production.
        data_tests:
          - not_null
          - accepted_values:
              description: >
                A class code missing from the CASE block in
                fct_marketer_production is not an error -- it renders as
                'Other', which is what the ELSE in FOD_query.sql did. But
                'Other' quietly appearing on the report is worth knowing about,
                so this warns rather than passing.

                These are the codes that CASE handles. Add a code there, add it
                here.
              arguments:
                values: [1, 2, 3, 4, 5, 10]
                quote: false
              config:
                severity: warn
      - name: mk_cls_edt
        description: '{{ doc("valid_from") }}'
        data_tests: [not_null]
      - name: mk_cls_xdt
        description: >
          Inclusive. Open-ended rows carry 9999-12-31 rather than null, which is
          what lets the point-in-time BETWEEN in int_class_by_marketer work
          without a coalesce.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          description: A window that ends before it starts matches nothing, silently.
          arguments:
            expression: "mk_cls_xdt >= mk_cls_edt"
      - dbt_utils.mutually_exclusive_ranges:
          description: >
            int_class_by_marketer picks a class with max(case when date between
            from and to). If two windows for one marketer overlap, that max()
            returns the higher class code rather than the correct one -- a wrong
            answer, not an error. Gaps are allowed; a marketer can have periods
            with no class on record.
          arguments:
            lower_bound_column: mk_cls_edt
            upper_bound_column: mk_cls_xdt
            partition_by: mktr_no
            gaps: allowed

  - name: stg_a360__marketer_status
    description: >
      Marketer contract-status history. Type-2, same shape as class history. The
      9999 open-ended sentinel is exposed both raw (as text) and resolved to a
      9999-12-31 timestamp -- see the model header for why both.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null]
      - name: mk_sts_tp_cd
        description: >
          Contract status. int_class_by_marketer and int_marketer_contract
          each carry the same ten-code IN list deciding which values count as
          active -- FOD_query.sql lines 71-73 and 169-171. Keep them in sync.
        data_tests: [not_null]
      - name: mk_sts_atv_edt
        description: '{{ doc("valid_from") }}'
        data_tests: [not_null]
      - name: mk_sts_atv_xdt_raw
        description: The source end date, untouched. May contain the 9999 sentinel.
        data_tests: [not_null]
      - name: mk_sts_atv_xdt
        description: mk_sts_atv_xdt_raw as a timestamp, sentinel resolved to 9999-12-31.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "mk_sts_atv_xdt >= mk_sts_atv_edt"
      - dbt_utils.mutually_exclusive_ranges:
          description: >
            Overlapping status windows would let one marketer be both active and
            terminated on the same date, which int_marketer_contract would turn
            into two contract rows and the mart into a duplicated marketer.
          arguments:
            lower_bound_column: mk_sts_atv_edt
            upper_bound_column: mk_sts_atv_xdt
            partition_by: mktr_no
            gaps: allowed

  - name: stg_a360__marketer_dashboard
    description: >
      Marketer dashboard dimension, one row per marketer. Joined to itself in
      the mart: rel_mktr_no points at the recruiting marketer, and it is the
      recruiter's name, title and office the report is grouped by.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null, unique]
      - name: rel_mktr_no
        description: The recruiting marketer.
        data_tests:
          - not_null
          - relationships:
              description: >
                The mart's self-join is an inner join, so a marketer pointing at
                a recruiter who does not exist drops off the report entirely.
              arguments:
                to: ref('stg_a360__marketer_dashboard')
                field: mktr_no
      - name: mk_cls_tp_cd
        description: >
          Current class code, used for the class LABEL on the report. Distinct
          from the point-in-time class codes in int_class_by_marketer.
      - name: mk_ttl_tp_cd
        description: Title code.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_a360__title_type')
                field: mk_ttl_tp_cd
              config:
                severity: warn
      - name: mk_sts_tp_cd
        description: >
          Dashboard status, filtered in fct_marketer_production against ('01', '04', '1C').
          Deliberately a different list from the contract statuses in
          active_status_codes.
      - name: alt_org_unit_cd
        description: Org unit, resolved to office and zone via stg_a360__org_zone.
        data_tests:
          - relationships:
              description: >
                Another inner join in the mart. An unmapped org unit removes
                that recruiter's whole downline from the report.
              arguments:
                to: ref('stg_a360__org_zone')
                field: org_unit_cd
              config:
                severity: warn
      - name: abreviated_nm
        description: Short display name. Source spelling, kept on purpose.
      - name: mk_fst_nm
        description: Marketer's first name.
      - name: mk_lst_nm
        description: Marketer's last name.

  - name: stg_a360__marketer_appointment
    description: >
      Marketer history: the original appointment date and the recruiting
      relationship. Expected to be one row per marketer -- see the model header
      for what to do if it stops being that. The name predates the recruiting
      columns; both sets come off the same source table.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests:
          - not_null
          - unique:
              description: >
                The mart inner-joins this on mktr_no, so a second row per
                marketer doubles that marketer's row and every measure on it.
                This is the test the removed `select distinct` used to hide, and
                it now guards int_triggered_marketers as well.
      - name: orig_appt_dt
        description: >
          Drives the six-month new-agent window and the active-on-date flags.
        data_tests: [not_null]
      - name: rcr_no
        description: >
          The recruiting marketer. int_triggered_marketers joins the dashboard
          dimension on it INNER, so a marketer whose recruiter is missing from
          that dimension drops off the CAP report.
        data_tests:
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('stg_a360__marketer_dashboard')
                field: mktr_no
      - name: orig_org_unit_cd
        description: >
          The marketer's ORIGINAL org unit. The CAP report resolves office and
          zone from this; fct_marketer_production uses the recruiter's current
          unit instead. The two reports can disagree for a marketer who moved,
          and that is not a bug in either.
      - name: split
        description: Share of the recruiting credit. Passed through to the mart untouched.
      - name: rcr_elig_dt
        description: >
          Recruiting-eligibility date -- when the credit triggered. The current
          year-to-date filter on it is what defines the CAP report's population.

  - name: stg_a360__org_zone
    description: General office and zone lookup, one row per org unit.
    columns:
      - name: org_unit_cd
        description: '{{ doc("org_unit_cd") }}'
        data_tests: [not_null, unique]
      - name: go_nm
        description: General office name, as shown on the report.
        data_tests: [not_null]
      - name: zn_nm
        description: Zone name, as shown on the report.
        data_tests: [not_null]

  - name: stg_a360__title_type
    description: >
      Job title lookup. ttl_nm is initcap()'d because the report matches
      titles on display text rather than on the code -- see the model header.
    columns:
      - name: mk_ttl_tp_cd
        description: '{{ doc("title_cd") }}'
        data_tests: [not_null, unique]
      - name: ttl_nm
        description: Initcap'd display text. Matched against the title list in fct_marketer_production.
        data_tests: [not_null, unique]

  - name: stg_a360__manpower
    description: Manpower / headcount flags, one row per marketer.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null, unique]
      - name: pro_rata_ind
        description: 1 if the marketer counts pro rata toward headcount.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: count_active
        description: 1 if the marketer counts toward active headcount.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  # ---------------------------------------------------------------------------
  # CAP report -- see fct_cap_candidate.
  # ---------------------------------------------------------------------------

  - name: stg_a360__contract_active
    description: >
      Marketer contract history, one row per marketer per contract window.
      Distinct from stg_a360__marketer_status, which is STATUS history off a
      different table -- read the model header before joining either.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null]
      - name: mk_cnt_tp_cd
        description: Contract type. Joins to stg_a360__contract_type.
        data_tests:
          - not_null
          - relationships:
              description: >
                int_triggered_marketers joins the type lookup INNER. A contract
                whose type is missing from it drops the marketer from the CAP
                report entirely, and silently.
              arguments:
                to: ref('stg_a360__contract_type')
                field: mk_cnt_tp_cd
      - name: mk_cnt_edt
        description: '{{ doc("valid_from") }}'
        data_tests: [not_null]
      - name: mk_cnt_xdt
        description: Window end, inclusive, 9999 sentinel resolved to 9999-12-31.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          description: A contract cannot end before it starts.
          arguments:
            expression: "mk_cnt_xdt >= mk_cnt_edt"
      - dbt_utils.unique_combination_of_columns:
          description: >
            One window per marketer per contract start. Overlapping windows are
            the thing that fans int_triggered_marketers out, and this is the
            closest cheap approximation of a check for them.
          arguments:
            combination_of_columns: [mktr_no, mk_cnt_edt]

  - name: stg_a360__contract_type
    description: >
      Contract type lookup. mk_cnt_tp_nm keeps the source's casing on purpose --
      fct_cap_candidate matches '%TAS%' against it, case-sensitively.
    columns:
      - name: mk_cnt_tp_cd
        description: Contract type code.
        data_tests: [not_null, unique]
      - name: mk_cnt_tp_nm
        description: Display text, source casing. Matched against '%TAS%' in the mart.
        data_tests: [not_null]

  - name: stg_a360__marketer
    description: >
      Marketer master, one row per marketer. Joined by int_triggered_marketers
      for ea_pgm_ind -- and, because that join is inner, as a filter.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null, unique]
      - name: ea_pgm_ind
        description: >
          Enhanced-agreement program indicator. 'T' is one of the two ways a row
          qualifies for the CAP report. No accepted_values test: the full domain
          is not documented anywhere, and guessing it would turn an unknown
          value into a build failure rather than a question.

  - name: stg_a360__org_zone_vg
    description: >
      Office and zone lookup, the _vg variant -- carries zone_cd, which
      stg_a360__org_zone does not. Used by the CAP report only.
    columns:
      - name: org_unit_cd
        description: '{{ doc("org_unit_cd") }}'
        data_tests: [not_null, unique]
      - name: go_nm
        description: General office name.
        data_tests: [not_null]
      - name: zone_cd
        description: Zone code.
        data_tests: [not_null]
      - name: zone_nm
        description: Zone name.
        data_tests: [not_null]

  - name: stg_aurora__epm_producer
    description: >
      EPM case, producer side. The bridge from an a360 marketer number to a
      candidate, and the place the text-to-integer marketer-number
      normalisation happens.
    columns:
      - name: epm_case_id
        description: EPM case identifier.
        data_tests: [not_null]
      - name: producer_num
        description: Marketer number as the source stores it, text and padded.
      - name: producer_mktr_no
        description: >
          producer_num normalised through nullif/trim/int, then back to string,
          so it joins to mktr_no. Null when producer_num is blank; those rows
          are dropped by int_candidate_cap_score because they can never match.
        data_tests:
          - not_null:
              config:
                severity: warn
                warn_if: ">100"
              description: >
                A handful of blank producer numbers is normal. Hundreds means
                the column has changed shape -- most likely it stopped being
                numeric, in which case the cast is quietly nulling real
                producers and the CAP report is losing rows.
          - relationships:
              config:
                severity: warn
              description: >
                A producer number with no marketer behind it contributes
                nothing: the mart joins on it and finds nothing. Warn, because
                EPM cases legitimately outlive marketer records.
              arguments:
                to: ref('stg_a360__marketer')
                field: mktr_no

  - name: stg_aurora__epm_candidate
    description: EPM case, candidate side. Pure bridge table.
    columns:
      - name: epm_case_id
        description: EPM case identifier. Joins to stg_aurora__epm_producer.
        data_tests: [not_null]
      - name: candidate_id
        description: Candidate identifier. Joins to agent_candidate_lead.can_id_nk.
        data_tests: [not_null]

  - name: stg_lake_aurora__agent_candidate_lead
    description: >
      Candidate leads, one row per VERSION of a lead -- the live-row filter
      (edh_record_status_in = 'A') is applied downstream, in
      int_candidate_cap_score, not here.
    columns:
      - name: can_id_nk
        description: Candidate natural key.
        data_tests: [not_null]
      - name: can_mktr_id
        description: The marketer the candidate is attached to. The ODS key, not a360's.
      - name: recrt_mktr_id
        description: Recruiting marketer id, reported by the mart as-is.
      - name: can_recrt_nm
        description: >
          Recruiter name per the ODS. The mart prefers it over the a360-built
          name and falls back when it is null, so nulls here are expected.
      - name: can_full_nm_protected
        description: >
          The candidate's name, still PROTECTED. Ciphertext until
          fct_cap_candidate runs it through protegrity.unprotect_clientname().
          Do not add a test that prints it; a failing test writes sample rows
          into the failures schema.
      - name: can_stg_nm
        description: Pipeline stage. Reported as `stage`.
      - name: edh_record_status_in
        description: ODS soft delete. 'A' is live.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          description: >
            One LIVE row per candidate. If this fails, int_candidate_cap_score
            fans out and a candidate is counted twice in the CAP report.
          arguments:
            combination_of_columns: [can_id_nk, edh_record_status_in]

  - name: stg_lake_aurora__candidate_assessment_score
    description: >
      CAP assessment scores. fit_score_val is exposed as both the source's text
      and a decimal, because the original query reported the one and compared
      the other.
    columns:
      - name: can_id_nk
        description: Candidate natural key. Joins to the lead.
        data_tests: [not_null]
      - name: fit_score_val
        description: The score exactly as stored. This is what the mart reports.
      - name: fit_score_val_num
        description: >
          The same value as a decimal, for the >= 75 comparison. Null when the
          text will not parse.
        data_tests:
          - not_null:
              config:
                severity: warn
              description: >
                A row that reaches here with a non-numeric score is reported by
                the mart with cap_score_75plus = 'N' regardless of what it says.
                Warn rather than error: the report is still correct about every
                other row, but somebody should look.
          - dbt_utils.accepted_range:
              config:
                severity: warn
              description: >
                CAP scores are a 0-100 fit score. Out of range means the column
                has changed meaning, and the 75 threshold with it.
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: cmpl_dt
        description: Completion date. Reported as cap_date.
      - name: edh_record_status_in
        description: ODS soft delete. 'A' is live.
        data_tests: [not_null]

  - name: stg_aurora__marketer_contract
    description: >
      Contract windows keyed by the ODS marketer id. Unrelated to
      int_marketer_contract despite the name -- different key, different source,
      different report.
    columns:
      - name: mktr_id
        description: ODS marketer id. Joins to agent_candidate_lead.can_mktr_id.
        data_tests: [not_null]
      - name: cnt_eff_dt
        description: Contract effective date. Reported as pts_date.
        data_tests: [not_null]
      - name: cnt_exp_dt
        description: Contract expiry date.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          description: >
            A contract cannot expire before it takes effect. The mart's pts_date
            join is a BETWEEN on these two, and an inverted window matches
            nothing -- so this failing shows up downstream as a null pts_date,
            not as an error.
          arguments:
            expression: "cnt_exp_dt >= cnt_eff_dt"
