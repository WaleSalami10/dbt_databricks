version: 2

models:
  - name: stg_pdm__dates
    description: >
      The date spine. Exactly one row: the reporting month selected by
      var('report_month'). Everything else derives its dates from here.
    columns:
      - name: month_end_date
        description: The reporting month end. Partition key of every mart.
        tests: [not_null, unique]
      - name: snapshot_date
        description: >
          When PDM was observed, not what is being reported. Audit only.
        tests: [not_null]
      - name: ytd_begin_dt
        tests: [not_null]
      - name: month_end_dim_sqn
        tests: [not_null]

  - name: stg_pdm__ytd_dates
    description: >
      Renaming view over stg_pdm__dates for the models that read ytd_end_dt.
      This used to be an independent second computation of the month end; the
      relationships test that guarded the two against drifting is gone because
      there is now only one computation to drift from.
    columns:
      - name: ytd_end_dt
        tests: [not_null, unique]
      - name: ytd_begin_dt
        tests: [not_null]
      - name: ytd_end_dim_sqn
        tests: [not_null]

  - name: stg_crm__sf_account
    columns:
      - name: case_cl_id
        tests: [not_null]

  - name: stg_metrics__policy_owner
    columns:
      - name: po_client_id_nk
        tests: [not_null]
