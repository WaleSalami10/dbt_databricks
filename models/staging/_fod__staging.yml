version: 2

# Doc block for the FOD (Field Office Development) report's staging models,
# kept separate from _staging.yml so the report's files stand on their own --
# see _fod_a360__sources.yml and _lake_orap10__sources.yml for the same idea
# applied to sources.

models:

  - name: stg_lake_orap10__marketer
    description: >
      Marketer dashboard dimension, EDH lake version. Unfiltered on
      edh_record_status_in -- int_fod_new_agents applies the 'A' filter.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null]
      - name: rcr_no
        description: The related (recruiting) marketer.
      - name: edh_record_status_in
        description: EDH record status. 'A' is the live row.
        data_tests: [not_null]

  - name: stg_lake_orap10__marketer_appl_history
    description: >
      Marketer application history, EDH lake version. Not deduplicated --
      int_fod_new_agents takes the distinct (marketer, date) pairs it needs.
    columns:
      - name: mktr_no
        description: '{{ doc("mktr_no") }}'
        data_tests: [not_null]
      - name: orig_appl_dt
        description: Original application date.
        data_tests: [not_null]

  - name: stg_a360__crm_user
    description: Salesforce user / CRM bridge, ties an a360 marketer to a Salesforce owner id.
    columns:
      - name: case_marketer_id_c
        description: >
          Marketer number as text. Not every value is numeric -- int_fod_events
          keeps only the ones that are before casting to an integer.
        data_tests: [not_null]
      - name: acf2id_c
        description: Salesforce owner id. Joins to stg_a360__sf_event.case_ownr_acf2id_id.
      - name: user_title
        description: Job title. Reported as title on the FOD report.

  - name: stg_a360__sf_event
    description: >
      Salesforce case-development events. Unfiltered on is_deleted_cd and the
      actvt_dt year window -- both are applied in int_fod_events.
    columns:
      - name: sale_force_id
        description: Event id, the grain of this model and of the FOD count's distinct count.
        data_tests: [not_null, unique]
      - name: case_ownr_acf2id_id
        description: Salesforce owner id. Joins to stg_a360__crm_user.acf2id_c.
      - name: case_dev_tool_desc
        description: >
          Development tool. int_fod_events keeps only 'FOD', 'PRP' and 'IID' --
          every other value is dropped from the report entirely.
      - name: case_dev_in_prog_desc
        description: Joins to stg_a360__case_dev_in_progress.sale_force_id_nk.
      - name: case_fod_occur_desc
        description: >
          'Yes'/'No'. Part of fod_count's qualifying condition alongside
          case_dev_tool = 'FOD' and is_fod_mgr_ownr_ind = 1.
      - name: is_fod_mgr_ownr_ind
        description: 1 when the event owner is the FOD manager.
      - name: actvt_dt
        description: Event activity date. Reported as event_date, the report's grain.
        data_tests: [not_null]
      - name: is_deleted_cd
        description: Salesforce soft-delete flag. 0 is live.
        data_tests: [not_null]
      - name: last_modify_dt
        description: Joins to stg_a360__adp_last_mod_stg.dt.

  - name: stg_a360__case_dev_in_progress
    description: Development-in-progress records, restricting sf_event to events with one active.
    columns:
      - name: sale_force_id_nk
        description: Joins to stg_a360__sf_event.case_dev_in_prog_desc.
        data_tests: [not_null]
      - name: last_modified_dt
        description: Joins to stg_a360__adp_last_mod_dip.dt.

  - name: stg_a360__adp_last_mod_dip
    description: >
      Point-in-time control table for sf_case_development_in_progress_c.
      int_fod_events joins on (sale_force_id_nk, dt) to keep only each row's
      current, as-loaded version.
    columns:
      - name: sale_force_id_nk
        data_tests: [not_null]
      - name: dt
        data_tests: [not_null]

  - name: stg_a360__adp_last_mod_stg
    description: >
      Point-in-time control table for sf_event. int_fod_events joins on
      (sale_force_id, dt) to keep only each event's current, as-loaded version.
    columns:
      - name: sale_force_id
        data_tests: [not_null]
      - name: dt
        data_tests: [not_null]
