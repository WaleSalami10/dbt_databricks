name: 'ppg'
version: '1.0.0'
config-version: 2

profile: 'ppg'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

# No `vars:` block. Every tunable lives in macros/ppg_config.sql and is read
# through ppg_var('name') rather than var('name'). Command-line overrides are
# unaffected:
#
#     dbt build --vars '{report_month: "2026-06-30"}'
#     dbt build --vars '{pdm_history_mode: scd2}'

models:
  ppg:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

seeds:
  ppg:
    +schema: seeds
    product_category_map:
      +column_types:
        product_ln_cd: string
        product_grp_nm: string
        product_nm: string
