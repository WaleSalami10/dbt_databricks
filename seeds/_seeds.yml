version: 2

seeds:
  - name: product_category_map
    description: >
      Replaces the four ~300-line CASE expressions in the original query.
      Keyed on product_ln_cd + product_grp_nm + product_nm, where product_nm
      of '*' means "any product name not matched by a more specific row".
      Business users edit this CSV; nobody has to touch SQL to add a product.
    columns:
      - name: product_ln_cd
        tests: [not_null]
      - name: product_grp_nm
        tests: [not_null]
      - name: product_type
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_ln_cd, product_grp_nm, product_nm]

  - name: lob_producer_role
    description: >
      The producer role that should win per LOB. These came from the
      commented-out filters in the original query. Only applied when
      var('apply_producer_role_filter') is true.
    columns:
      - name: lob_nm
        tests: [not_null, unique]
