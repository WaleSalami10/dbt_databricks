version: 2

seeds:

  - name: marketer_class_labels
    description: >
      Maps the numeric mk_cls_tp_cd to its display label. Was a hardcoded CASE
      statement on lines 120-127 of FOD_query.sql. The labels are placeholders
      -- confirm them against the class taxonomy the business actually uses.
    columns:
      - name: class_cd
        description: Class code. Matches mk_cls_tp_cd on the dashboard dimension.
        data_tests: [unique, not_null]
      - name: class_label
        description: Display label shown on the report.
        data_tests: [not_null]

  - name: active_status_codes
    description: >
      Contract status codes that count as "active" for reporting. Was a
      hardcoded IN list appearing twice in FOD_query.sql (lines 71-73 and
      169-171). Both int_class_by_marketer and int_marketer_contract read this
      one file, so the two can no longer drift apart.

      Descriptions are placeholders -- confirm them with the business owner and
      correct this file.
    columns:
      - name: status_cd
        description: Contract status code, matching mk_sts_tp_cd.
        data_tests: [unique, not_null]
      - name: status_desc
        description: Human-readable meaning. Placeholder, unverified.
        data_tests: [not_null]

  - name: reportable_titles
    description: >
      Job titles that appear on this report. Was line 178 of FOD_query.sql.
      Matched on initcap'd display name, which is fragile -- see the README and
      the stg_a360__title_type header.
    columns:
      - name: title_nm
        description: Title display text, initcap'd to match stg_a360__title_type.
        data_tests: [unique, not_null]

  - name: reportable_dashboard_status_codes
    description: >
      Status codes the recruiting marketer's dashboard record must have to
      appear on the report. Was line 179 of FOD_query.sql. Deliberately a
      separate list from active_status_codes -- they are different filters that
      happen to overlap.
    columns:
      - name: status_cd
        description: Dashboard status code, matching mk_sts_tp_cd.
        data_tests: [unique, not_null]
